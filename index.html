<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typing Practice Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a word-processor window — title bar, ribbon, task strip, then a paper page centred on a desk-grey canvas */
:root{
  --desk:#e7eaee; --chrome:#f7f8fa; --line:#cfd5dd; --ink:#1d2430; --muted:#5b6575;
  --ribbon:#24508f; --ribbon-ink:#ffffff; --accent:#24508f; --paper:#ffffff; --paper-ink:#1b1f27;
  --ok:#1d7a46; --ok-bg:#dff3e7; --bad:#b4232c; --bad-bg:#fbe1e3; --cursor:#f3c93b;
  --f-ui:"Atkinson Hyperlegible",system-ui,"Segoe UI",sans-serif;
  --f-doc:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#161a21; --chrome:#1f242d; --line:#343b47; --ink:#e6e9ef; --muted:#9aa4b4;
  --ribbon:#1b3b6b; --accent:#8fb4ee; --paper:#fbfbf8; --paper-ink:#1b1f27;
  --ok:#5fd394; --ok-bg:#173826; --bad:#ff8a92; --bad-bg:#43191d; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#161a21; --chrome:#1f242d; --line:#343b47; --ink:#e6e9ef; --muted:#9aa4b4;
  --ribbon:#1b3b6b; --accent:#8fb4ee; --paper:#fbfbf8; --paper-ink:#1b1f27;
  --ok:#5fd394; --ok-bg:#173826; --bad:#ff8a92; --bad-bg:#43191d; color-scheme:dark}

html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
.app{min-height:100%;display:flex;flex-direction:column}
.bar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.titlebar{background:var(--ribbon);color:var(--ribbon-ink);padding-block:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.titlebar .doc{font-weight:700;letter-spacing:.01em}
.titlebar .saved{opacity:.75;font-size:13px}
.titlebar .spacer{flex:1}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:transparent;border:0;color:var(--ribbon-ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:4px 4px 0 0;cursor:pointer;opacity:.85}
.tab[aria-selected="true"]{background:var(--chrome);color:var(--ink);opacity:1;font-weight:700}
.tab:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--cursor);outline-offset:2px}

.ribbon{background:var(--chrome);border-bottom:1px solid var(--line);padding-block:10px;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.group{display:flex;flex-direction:column;gap:6px}
.group .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn,select{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer;min-height:34px}
.dark-safe select,select{background:var(--chrome)}
.btn{background:var(--chrome)}
.btn:hover{border-color:var(--accent)}
.btn.icon{width:36px;padding:0;font-family:var(--f-doc);font-size:16px}
.btn.primary{background:var(--accent);color:var(--chrome);border-color:var(--accent);font-weight:700}
.btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.task{background:var(--chrome);border-bottom:1px solid var(--line);padding-block:12px}
.task-inner{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.task h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.target{font-family:var(--f-mono);font-size:19px;line-height:1.7;word-break:break-word;color:var(--muted);min-width:0}
.target span{border-radius:2px}
.target .ok{color:var(--ok);background:var(--ok-bg)}
.target .bad{color:var(--bad);background:var(--bad-bg);text-decoration:underline}
.target .cur{background:var(--cursor);color:#1b1f27}
.stats{display:flex;gap:20px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:14px}
.stats b{font-size:18px;color:var(--ink)}
.stats div{color:var(--muted)}

.canvas{flex:1;padding-block:24px 40px}
.page{max-width:860px;margin:0 auto;background:var(--paper);color:var(--paper-ink);box-shadow:0 1px 3px rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.08);min-height:520px;padding:56px clamp(20px,7vw,80px);position:relative}
.editor{display:block;width:100%;min-height:400px;border:0;outline:0;resize:none;background:transparent;color:var(--paper-ink);font-family:var(--f-doc);font-size:20px;line-height:1.6;caret-color:var(--ribbon);padding:0;box-sizing:border-box;word-wrap:break-word}
.editor[contenteditable]:empty::before,.editor::placeholder{content:attr(data-ph);color:#8a93a3}
.hint{position:absolute;inset:56px clamp(20px,7vw,80px) auto;pointer-events:none;color:#8a93a3;font-family:var(--f-doc);font-size:20px}
.done{margin-top:16px;padding:14px 16px;border:1px solid var(--ok);background:var(--ok-bg);color:var(--ok);border-radius:4px;font-weight:700}
.statusbar{background:var(--chrome);border-top:1px solid var(--line);padding-block:6px;font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.target .cur{animation:blink 1s steps(2) infinite}}
@keyframes blink{50%{background:transparent;color:inherit}}
</style>
</head><body style="margin:0">

<div class="app">
  <div class="titlebar bar">
    <span class="doc" id="docName">Lesson 1 – Home Row.docx</span>
    <span class="saved" id="savedNote">Practice copy</span>
    <span class="spacer"></span>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabPractice" aria-selected="true">Practice</button>
      <button class="tab" role="tab" id="tabFree" aria-selected="false">Free Writing</button>
    </div>
  </div>

  <div class="ribbon bar">
    <div class="group" id="grpLesson">
      <span class="lbl">Lesson</span>
      <div class="row">
        <select id="lesson" aria-label="Choose lesson"></select>
        <button class="btn primary" id="restart">Start again</button>
      </div>
    </div>
    <div class="group" id="grpFormat" hidden>
      <span class="lbl">Font</span>
      <div class="row">
        <button class="btn icon" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button class="btn icon" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <button class="btn icon" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
        <select id="size" aria-label="Font size">
          <option value="16">16</option><option value="20" selected>20</option><option value="26">26</option><option value="32">32</option>
        </select>
        <button class="btn" id="clearFree">Clear page</button>
      </div>
    </div>
    <div class="group">
      <span class="lbl">View</span>
      <div class="row">
        <button class="btn" id="bigger" aria-pressed="false">Large text</button>
      </div>
    </div>
  </div>

  <div class="task bar" id="taskPanel">
    <div class="task-inner">
      <h2>Type this on the page below</h2>
      <div class="target" id="target" aria-live="off"></div>
      <div class="stats">
        <div>Speed <b id="wpm">0</b> words/min</div>
        <div>Accuracy <b id="acc">100</b>%</div>
        <div>Progress <b id="prog">0</b>%</div>
        <div>Mistakes <b id="errs">0</b></div>
      </div>
    </div>
  </div>

  <div class="canvas bar">
    <div class="page" id="page">
      <textarea class="editor" id="practice" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Typing area"></textarea>
      <div class="hint" id="hint">Click here and start typing…</div>
      <div class="editor" id="free" contenteditable="true" spellcheck="true" data-ph="Click here and write anything – a letter, your name, a job application…" hidden aria-label="Free writing page"></div>
      <div class="done" id="done" hidden></div>
    </div>
  </div>

  <div class="statusbar bar">
    <span id="sbPage">Page 1 of 1</span>
    <span id="sbWords">0 words</span>
    <span id="sbChars">0 characters</span>
    <span>English (India)</span>
  </div>
</div>

<script>
const LESSONS=[
  {name:"Lesson 1 – Home Row",text:"asdf jkl; asdf jkl; sad lad fall ask flask dad"},
  {name:"Lesson 2 – Top Row",text:"we are here to type quietly. your top row keys are q w e r t y u i o p"},
  {name:"Lesson 3 – Bottom Row",text:"zebra can move bravely. mix a cozy box of nine vans."},
  {name:"Lesson 4 – Capitals",text:"My name is Ravi. I live in Chennai. I want to learn Computer Skills."},
  {name:"Lesson 5 – Numbers",text:"Call 044 2345 6789 before 10:30 on 21 October 2026."},
  {name:"Lesson 6 – Job Letter",text:"Dear Sir, I am applying for the post of Data Entry Operator. I can type fast and accurately. Thank you."},
  {name:"Lesson 7 – Shop Bill",text:"Rice 5 kg - Rs. 300, Oil 1 L - Rs. 160, Sugar 2 kg - Rs. 90. Total: Rs. 550."}
];
const $=id=>document.getElementById(id);
const sel=$("lesson"),target=$("target"),ta=$("practice"),free=$("free"),hint=$("hint"),done=$("done");
LESSONS.forEach((l,i)=>{const o=document.createElement("option");o.value=i;o.textContent=l.name;sel.appendChild(o)});

let cur=0,start=0,mistakes=0,lastLen=0;
function load(i){
  cur=i;ta.value="";start=0;mistakes=0;lastLen=0;done.hidden=true;ta.readOnly=false;
  $("docName").textContent=LESSONS[i].name+".docx";
  render();ta.focus({preventScroll:true});
}
function render(){
  const t=LESSONS[cur].text,v=ta.value;let html="",correct=0;
  for(let i=0;i<t.length;i++){
    const ch=t[i]===" "?"&nbsp;":t[i].replace(/&/g,"&amp;").replace(/</g,"&lt;");
    let c="";
    if(i<v.length){c=v[i]===t[i]?"ok":"bad";if(c==="ok")correct++}
    else if(i===v.length)c="cur";
    html+=`<span class="${c}">${ch}</span>`;
    if(t[i]===" ")html+="<wbr>";
  }
  target.innerHTML=html;
  hint.hidden=v.length>0;
  const mins=start?(Date.now()-start)/60000:0;
  $("wpm").textContent=mins>0.02?Math.round((correct/5)/mins):0;
  $("acc").textContent=v.length?Math.max(0,Math.round(100*(v.length-mistakes)/v.length)):100;
  $("prog").textContent=Math.min(100,Math.round(100*Math.min(v.length,t.length)/t.length));
  $("errs").textContent=mistakes;
  status(v);
  if(v.length>=t.length){
    ta.readOnly=true;
    done.hidden=false;
    done.textContent=`Lesson complete! ${$("wpm").textContent} words per minute at ${$("acc").textContent}% accuracy. `+(cur<LESSONS.length-1?"Choose the next lesson or press Start again.":"You finished all lessons.");
  }
}
function status(text){
  const w=text.trim()?text.trim().split(/\s+/).length:0;
  $("sbWords").textContent=w+(w===1?" word":" words");
  $("sbChars").textContent=text.length+" characters";
}
ta.addEventListener("input",()=>{
  if(!start&&ta.value.length)start=Date.now();
  const t=LESSONS[cur].text,v=ta.value;
  if(v.length>lastLen){for(let i=lastLen;i<v.length;i++)if(v[i]!==t[i])mistakes++}
  lastLen=v.length;render();
});
ta.addEventListener("paste",e=>e.preventDefault());
sel.addEventListener("change",()=>load(+sel.value));
$("restart").addEventListener("click",()=>load(cur));
$("page").addEventListener("click",()=>{(mode==="free"?free:ta).focus()});

let mode="practice";
function setMode(m){
  mode=m;const p=m==="practice";
  $("tabPractice").setAttribute("aria-selected",p);$("tabFree").setAttribute("aria-selected",!p);
  $("taskPanel").hidden=!p;$("grpLesson").hidden=!p;$("grpFormat").hidden=p;
  ta.hidden=!p;hint.hidden=!p||ta.value.length>0;done.hidden=!p||ta.value.length<LESSONS[cur].text.length;free.hidden=p;
  $("docName").textContent=p?LESSONS[cur].name+".docx":"My Document.docx";
  status(p?ta.value:free.innerText);(p?ta:free).focus();
}
$("tabPractice").addEventListener("click",()=>setMode("practice"));
$("tabFree").addEventListener("click",()=>setMode("free"));
document.querySelectorAll("[data-cmd]").forEach(b=>{
  b.addEventListener("mousedown",e=>e.preventDefault());
  b.addEventListener("click",()=>{document.execCommand(b.dataset.cmd);free.focus();syncFmt()});
});
function syncFmt(){document.querySelectorAll("[data-cmd]").forEach(b=>{let s=false;try{s=document.queryCommandState(b.dataset.cmd)}catch(e){}b.setAttribute("aria-pressed",s)})}
document.addEventListener("selectionchange",()=>{if(mode==="free")syncFmt()});
$("size").addEventListener("change",e=>{free.style.fontSize=e.target.value+"px";free.focus()});
$("clearFree").addEventListener("click",()=>{free.innerHTML="";status("");free.focus()});
free.addEventListener("input",()=>{status(free.innerText);try{localStorage.setItem("freeDraft",free.innerHTML)}catch(e){}});
try{const d=localStorage.getItem("freeDraft");if(d)free.innerHTML=d}catch(e){}
$("bigger").addEventListener("click",e=>{
  const on=e.currentTarget.getAttribute("aria-pressed")!=="true";
  e.currentTarget.setAttribute("aria-pressed",on);
  target.style.fontSize=on?"26px":"";ta.style.fontSize=on?"28px":"";
});
load(0);
</script>
</body></html>
